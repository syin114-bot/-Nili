<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NILAM 快速填写助手</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2230;--mu:#667085;--ac:#2563eb;--bd:#e2e6ee}
@media (prefers-color-scheme:dark){:root{--bg:#13161b;--card:#1d2129;--tx:#eceff4;--mu:#9aa3b2;--ac:#6ea0ff;--bd:#2c323c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;padding:16px 14px 80px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:8px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;flex:1;min-width:150px}
button:disabled{opacity:.55}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.hd button{padding:5px 10px;font-size:13px;flex:none}
.row{padding:6px 0;border-top:1px solid var(--bd);cursor:pointer}
.row small{display:block;color:var(--mu);font-size:12px}
.row span{word-break:break-word}
.kat{font-weight:700;color:var(--ac)}
#msg{color:var(--mu);text-align:center;padding:16px 0}
.err{color:#dc2626}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:.95}
</style>
</head>
<body>
<h1>NILAM 快速填写助手</h1>
<div class="sub">书的资料来自 Open Library（真实资料）。点任意一栏即可复制。</div>
<div class="bar">
  <select id="kat"><option value="Fiksyen">Fiksyen</option><option value="Bukan Fiksyen">Bukan Fiksyen</option></select>
  <button class="main" id="go">生成 10 本</button>
</div>
<div class="sub" id="cnt"></div>
<div class="bar">
  <button id="bk">复制备份</button>
  <button id="dl">下载备份文件</button>
  <button id="rs">还原备份</button>
</div>
<div id="list"></div>
<div id="msg"></div>
<div class="toast" id="t"></div>
<script>
const KEY="nilam_seen_oss_v1",LAST="nilam_last_oss_v1";
let seen=[];
try{seen=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function save(){try{localStorage.setItem(KEY,JSON.stringify(seen))}catch(e){}}
function upd(){$("cnt").textContent="已给过 "+seen.length+" 本（自动去重，记录保存在这个浏览器里）"}
function toast(s){const t=$("t");t.textContent=s;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1200)}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("已复制")).catch(()=>fb(text))}else fb(text)
}
function fb(text){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("已复制")}catch(e){toast("复制失败")}a.remove()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* 模板：每本书用不同句子，都带书名，Rumusan 至少 10 个字，Pengajaran 至少 5 个字 */
const RF=[
 t=>`The book "${t}" tells an interesting story about characters who face problems and try to solve them.`,
 t=>`In "${t}", the main character goes through an exciting adventure and learns important things along the way.`,
 t=>`"${t}" is a story about people who meet challenges and find ways to move forward in their lives.`,
 t=>`This story, "${t}", shows how the characters deal with difficult situations and make important choices.`,
 t=>`"${t}" follows a group of characters whose journey teaches them about friendship, courage and honesty.`,
 t=>`The story of "${t}" is about a character who overcomes difficulties and grows stronger in the end.`,
 t=>`"${t}" describes the experiences of the main characters and how they learn from their mistakes.`,
 t=>`In the book "${t}", the characters work together to solve a problem and discover something new.`,
 t=>`"${t}" is an enjoyable story that shows how people face fear and make brave decisions.`,
 t=>`The book "${t}" presents a story full of events that teach the characters valuable lessons.`
];
const RB=[
 t=>`The book "${t}" gives useful information and explains its topic clearly to the reader.`,
 t=>`In "${t}", the writer shares facts and ideas that help readers understand the topic better.`,
 t=>`"${t}" explains important information about its subject in a simple and clear way.`,
 t=>`This book, "${t}", presents knowledge and examples that help readers learn something new.`,
 t=>`"${t}" discusses its main topic and gives readers facts they can use in daily life.`,
 t=>`The writer of "${t}" explains the topic step by step so that readers can follow easily.`,
 t=>`"${t}" provides interesting facts and explanations that increase the reader's knowledge.`,
 t=>`In the book "${t}", the author describes real information and ideas about the subject.`
];
const PF=["We should be brave when facing problems.","Friendship and honesty are very important.","Never give up when things are difficult.","Teamwork helps us solve big problems.","We must be kind and help other people.","Hard work and patience lead to success.","Always think carefully before making a decision.","Telling the truth is always the right choice.","We should learn from our mistakes.","Believing in yourself brings courage."];
const PB=["Reading helps us gain useful knowledge.","We should always keep learning new things.","Knowledge helps us make better decisions.","Facts and information help us understand the world.","Learning new ideas makes us more confident.","We should use what we learn in daily life."];

const QF="subject:fiction language:eng";
const QB="(subject:biography OR subject:science OR subject:history OR subject:nature) language:eng";
async function fetchBatch(kat,keys,got){
  const q=kat==="Fiksyen"?QF:QB;
  const page=1+Math.floor(Math.random()*60);
  const url="https://openlibrary.org/search.json?q="+encodeURIComponent(q)+"&fields=title,author_name,publisher,first_publish_year,number_of_pages_median&limit=100&page="+page;
  const r=await fetch(url);
  if(!r.ok)throw new Error("net");
  const d=await r.json();
  for(const x of shuffle(d.docs||[])){
    if(got.length>=10)break;
    const t=(x.title||"").trim(),a=(x.author_name||[])[0],p=(x.publisher||[])[0];
    const y=x.first_publish_year,n=x.number_of_pages_median;
    if(!t||!a||!p||!y||!n)continue;
    if(/[^\x00-\x7F]/.test(t+a+p))continue;
    if(n<20||n>1500||y<1900||y>2026||t.length>90||p.length>60)continue;
    const k=norm(t);
    if(!k||keys.has(k))continue;
    keys.add(k);
    got.push({tajuk:t,penulis:a,penerbit:p,tahun:String(y),muka:String(n),kategori:kat});
  }
}
function fill(got,kat){
  const R=shuffle((kat==="Fiksyen"?RF:RB).slice()),P=shuffle((kat==="Fiksyen"?PF:PB).slice());
  got.forEach((b,i)=>{b.bahasa="Bahasa Inggeris";b.rumusan=R[i%R.length](b.tajuk);b.pengajaran=P[i%P.length]});
}
const F=[["Kategori","kategori"],["Pilihan Bahasa","bahasa"],["Tajuk","tajuk"],["Bil. Muka Surat","muka"],["Penulis","penulis"],["Penerbit","penerbit"],["Tahun Terbitan","tahun"],["Rumusan","rumusan"],["Pengajaran","pengajaran"]];
function render(books){
  const L=$("list");L.innerHTML="";
  books.forEach((b,i)=>{
    const c=document.createElement("div");c.className="card";
    const hd=document.createElement("div");hd.className="hd";
    const h=document.createElement("b");h.textContent=(i+1)+". "+b.tajuk;
    const bt=document.createElement("button");bt.textContent="复制全部";
    bt.onclick=()=>copy(F.map(f=>f[0]+": "+b[f[1]]).join("\n"));
    hd.append(h,bt);c.appendChild(hd);
    F.forEach(f=>{
      const r=document.createElement("div");r.className="row";
      const s=document.createElement("small");s.textContent=f[0];
      const v=document.createElement("span");v.textContent=b[f[1]];
      if(f[0]==="Kategori")v.className="kat";
      r.append(s,v);r.onclick=()=>copy(b[f[1]]);c.appendChild(r);
    });
    L.appendChild(c);
  });
}
$("go").onclick=async()=>{
  const btn=$("go"),msg=$("msg"),kat=$("kat").value;
  btn.disabled=true;msg.className="";msg.textContent="正在查找，请稍等…";$("list").innerHTML="";
  try{
    const keys=new Set(seen.map(norm)),got=[];
    let tries=0;
    while(got.length<10&&tries<8){tries++;await fetchBatch(kat,keys,got)}
    if(!got.length){msg.className="err";msg.textContent="没有找到合适的书，请再点一次。";btn.disabled=false;return}
    fill(got,kat);
    got.forEach(b=>seen.push(b.tajuk));save();upd();
    try{localStorage.setItem(LAST,JSON.stringify(got))}catch(e){}
    msg.textContent=got.length<10?"这次只找到 "+got.length+" 本，可再点一次。":"";
    render(got);window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){msg.className="err";msg.textContent="连接图书库失败，请检查网络后再试。"}
  btn.textContent="再来 10 本";btn.disabled=false;
};
$("bk").onclick=()=>copy(JSON.stringify(seen));
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(seen)],{type:"application/json"}));a.download="nilam-backup.json";document.body.appendChild(a);a.click();a.remove()};
$("rs").onclick=()=>{const s=prompt("粘贴之前备份的内容：");if(!s)return;try{const a=JSON.parse(s);if(Array.isArray(a)){seen=Array.from(new Set(seen.concat(a.map(String))));save();upd();toast("已还原")}}catch(e){toast("格式不对")}};
upd();
try{const l=JSON.parse(localStorage.getItem(LAST)||"[]");if(l.length){render(l);$("go").textContent="再来 10 本";$("msg").textContent="（这是上一批的 10 本，可继续抄）"}}catch(e){}
</script>
</body>
</html>
